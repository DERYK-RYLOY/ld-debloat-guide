<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" font-family="Segoe UI, sans-serif">
  <!-- benchmark-01-ram-before-after.svg - LD DEBLOAT GUIDE -->
  <!-- Honest version: only what was measured, nothing averaged away. -->
  <rect width="1280" height="920" fill="#f7f6f0"/>
  <line x1="0" y1="140" x2="1280" y2="140" stroke="#e5e2d8"/>

  <text x="64" y="76" fill="#16324a" font-size="44" font-weight="800" letter-spacing="2" font-family="Georgia, serif">RAM &#8212; THE HONEST VERSION</text>
  <text x="64" y="110" fill="#6b7d8d" font-size="16">measured on the test rig, 2026-11-10 &#183; no averaged-away conditions &#183; if a number is here, we wrote it down</text>

  <!-- ============ PANEL A: guest-visible RAM ============ -->
  <rect x="48" y="164" width="370" height="640" rx="10" fill="#ffffff" stroke="#e5e2d8"/>
  <text x="72" y="196" fill="#16324a" font-size="12" font-weight="800" letter-spacing="2">A &#183; GUEST-VISIBLE RAM</text>
  <text x="72" y="214" fill="#6b7d8d" font-size="11">what Android could actually see</text>

  <text x="72" y="262" fill="#16324a" font-size="13" font-weight="700">4096 MB &#8226; 4 CPU</text>
  <rect x="72" y="272" width="280" height="26" rx="4" fill="#efece3"/>
  <rect x="72" y="272" width="0" height="26" rx="4" fill="#e4572e">
    <animate attributeName="width" from="0" to="280" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>
  <text x="72" y="320" fill="#a33b16" font-size="12">swap storm under Brave load &#8594; "Not Responding"</text>

  <text x="72" y="366" fill="#16324a" font-size="13" font-weight="700">2048 MB &#8226; 3 CPU</text>
  <rect x="72" y="376" width="280" height="26" rx="4" fill="#efece3"/>
  <rect x="72" y="376" width="0" height="26" rx="4" fill="#f2b64a">
    <animate attributeName="width" from="0" to="140" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>
  <text x="72" y="424" fill="#8a6a08" font-size="12">freeze at ~16 s, twice, identical (log-proven)</text>

  <text x="72" y="470" fill="#16324a" font-size="13" font-weight="700">3072 MB &#8226; 3 CPU</text>
  <rect x="72" y="480" width="280" height="26" rx="4" fill="#efece3"/>
  <rect x="72" y="480" width="0" height="26" rx="4" fill="#12b7a8">
    <animate attributeName="width" from="0" to="210" dur="1.4s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>
  <text x="72" y="528" fill="#0d8f84" font-size="12" font-weight="700">stable boots &#8212; THE HOUSE CHOICE</text>

  <rect x="72" y="560" width="324" height="112" rx="6" fill="#0d1b28"/>
  <text x="90" y="588" fill="#f2b64a" font-size="11" font-weight="800" letter-spacing="2">WHY THE CAP MATTERS</text>
  <text x="90" y="612" fill="#e8eef4" font-size="12">Windows (~3 GB) + Brave (~2 GB) are</text>
  <text x="90" y="632" fill="#e8eef4" font-size="12">not shrink&#8211;wrapped. The cap is the</text>
  <text x="90" y="652" fill="#e8eef4" font-size="12">only knob that decides if you swap.</text>

  <!-- ============ PANEL B: process tree ============ -->
  <rect x="442" y="164" width="370" height="640" rx="10" fill="#ffffff" stroke="#e5e2d8"/>
  <text x="466" y="196" fill="#16324a" font-size="12" font-weight="800" letter-spacing="2">B &#183; INSIDE LD'S OWN TREE</text>
  <text x="466" y="214" fill="#6b7d8d" font-size="11">what was running, before &#8594; after</text>

  <text x="466" y="250" fill="#e4572e" font-size="11" font-weight="800" letter-spacing="2">BEFORE (log-proven, 10:39)</text>
  <g font-size="14" fill="#16324a">
    <rect x="466" y="262" width="322" height="34" rx="5" fill="#fbe9e0" stroke="#e4572e"/>
    <text x="478" y="284">ldplayerpartner.exe (pid 9188)</text>
    <rect x="466" y="304" width="322" height="34" rx="5" fill="#fbe9e0" stroke="#e4572e"/>
    <text x="478" y="326">LDReporter &#8594; POST 200 OK</text>
    <rect x="466" y="346" width="322" height="34" rx="5" fill="#fbe9e0" stroke="#e4572e"/>
    <text x="478" y="368">LDPlayerENSvr (Automatic)</text>
    <rect x="466" y="388" width="322" height="34" rx="5" fill="#fbe9e0" stroke="#e4572e"/>
    <text x="478" y="410">dnrepairer.exe (43.9 MB re-downloader)</text>
  </g>
  <g stroke="#e4572e" stroke-width="4" stroke-linecap="round">
    <line x1="476" y1="272" x2="778" y2="404" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
    </line>
  </g>
  <text x="632" y="298" fill="#a33b16" font-size="11" font-weight="800" letter-spacing="2" opacity="0">ALL GONE
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
  </text>

  <text x="466" y="462" fill="#0d8f84" font-size="11" font-weight="800" letter-spacing="2">AFTER (ps -A, 12:11)</text>
  <g font-size="14" fill="#16324a">
    <rect x="466" y="474" width="322" height="34" rx="5" fill="#eafaf0" stroke="#2fbf71"/>
    <text x="478" y="496">android init (Google/LD core)</text>
    <rect x="466" y="516" width="322" height="34" rx="5" fill="#eafaf0" stroke="#2fbf71"/>
    <text x="478" y="538">Lawnchair &#183; Aurora &#183; Magisk</text>
    <rect x="466" y="558" width="322" height="34" rx="5" fill="#eafaf0" stroke="#2fbf71"/>
    <text x="478" y="580">engine ~400&#8211;460 MB + dnplayer ~100 MB</text>
  </g>
  <text x="466" y="636" fill="#6b7d8d" font-size="11">Whole tree shrank by <tspan font-weight="800" fill="#16324a">removing owners</tspan>,</text>
  <text x="466" y="655" fill="#6b7d8d" font-size="11">not by shrinking the engine &#8212; partner-process RSS</text>
  <text x="466" y="674" fill="#6b7d8d" font-size="11">was never captured; we do not chart bytes we</text>
  <text x="466" y="693" fill="#6b7d8d" font-size="11">did not measure.</text>

  <!-- ============ PANEL C: host free RAM ============ -->
  <rect x="836" y="164" width="396" height="640" rx="10" fill="#ffffff" stroke="#e5e2d8"/>
  <text x="860" y="196" fill="#16324a" font-size="12" font-weight="800" letter-spacing="2">C &#183; HOST FREE RAM &#8212; NOT YOUR WIN</text>
  <text x="860" y="214" fill="#6b7d8d" font-size="11">the number everyone wanted to brag about</text>

  <text x="860" y="258" fill="#16324a" font-size="13" font-weight="700">under full load</text>
  <rect x="860" y="268" width="180" height="22" rx="4" fill="#efece3"/>
  <rect x="860" y="268" width="0" height="22" rx="4" fill="#e4572e">
    <animate attributeName="width" from="0" to="42" dur="1.1s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="1046" y="285" fill="#16324a" font-size="13" font-weight="800">~0.8 GB</text>

  <text x="860" y="330" fill="#16324a" font-size="13" font-weight="700">emulator closed</text>
  <rect x="860" y="340" width="180" height="22" rx="4" fill="#efece3"/>
  <rect x="860" y="340" width="0" height="22" rx="4" fill="#12b7a8">
    <animate attributeName="width" from="0" to="130" dur="1.4s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="1046" y="357" fill="#16324a" font-size="13" font-weight="800">~2.7&#8211;3.5 GB</text>

  <rect x="860" y="392" width="348" height="88" rx="6" fill="#0d1b28"/>
  <text x="878" y="420" fill="#f2b64a" font-size="11" font-weight="800" letter-spacing="2">THE DIFFERENCE IS BRAVE + WINDOWS</text>
  <text x="878" y="444" fill="#e8eef4" font-size="12">Brave ~2 GB + Windows ~3 GB eat the</text>
  <text x="878" y="464" fill="#e8eef4" font-size="12">headroom. LD never owned this number.</text>

  <text x="860" y="520" fill="#a33b16" font-size="12" font-weight="800" letter-spacing="2">DO NOT QUOTE THE OLD 0.77 &#8594; 3.35 GB CHART</text>
  <text x="860" y="542" fill="#6b7d8d" font-size="12">it compared two different measurement</text>
  <text x="860" y="560" fill="#6b7d8d" font-size="12">conditions and called it a debloat win.</text>
  <text x="860" y="578" fill="#6b7d8d" font-size="12">That chart lied. Kill it on sight.</text>

  <rect x="860" y="614" width="348" height="72" rx="6" fill="#eafaf0" stroke="#2fbf71"/>
  <text x="878" y="638" fill="#0e7a45" font-size="11" font-weight="800" letter-spacing="2">WHAT LD DOES OWN</text>
  <text x="878" y="660" fill="#10492a" font-size="12">3072 MB cap &#183; 3 CPUs &#183; zero telemetry &#183;</text>
  <text x="878" y="678" fill="#10492a" font-size="12">zero ads &#183; zero re-downloads. That is the win.</text>

  <!-- footer -->
  <text x="64" y="856" fill="#6b7d8d" font-size="13">Sources: ldpartner.log (10:39 post) &#183; VBox.log (16-s wedge) &#183; ps -A (12:11) &#183; verify-debloat.ps1 &#183; i5-8350U &#183; 8 GB RAM &#183; LDPlayer 9.5.41.1</text>
  <text x="64" y="884" fill="#6b7d8d" font-size="12">Illustration: same data, presented with conditions attached &#8212; numbers beat vibes</text>
</svg>
